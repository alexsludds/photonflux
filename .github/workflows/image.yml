# Builds the full photonflux image (repo-root Dockerfile: circulax/JAX, SKY130
# card extraction, warmed model caches) and publishes it to
# ghcr.io/<owner>/photonflux. The Codespaces devcontainer runs this image, so
# "Open in Codespaces" starts the web app without rebuilding anything.
# Needs the `openvaf-ir` release asset (.github/workflows/openvaf-ir.yml).
name: image

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/photonflux" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
