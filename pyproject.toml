[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photonflux"
version = "0.2.0"
description = "Differentiable photonic + analog co-simulation in Python: Verilog-A (OpenVAF/OSDI) photonics + SKY130 electronics in one JAX/circulax system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
photonflux = "photonflux.cli:main"

[tool.setuptools]
packages = ["photonflux"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
