# Builds the full photonflux image (repo-root Dockerfile: circulax/JAX, SKY130
# card extraction, warmed model caches) and publishes it to
# ghcr.io/<owner>/photonflux. The Codespaces devcontainer runs this image, so
# "Open in Codespaces" starts the web app without rebuilding anything.
# Needs the `openvaf-ir` release asset: it also re-runs after
# .github/workflows/openvaf-ir.yml succeeds, which covers the very first build.
name: image

on:
  workflow_dispatch:
  push:
    branches: [main]
  workflow_run:
    workflows: [openvaf-ir]
    types: [completed]

concurrency:
  group: image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/photonflux" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          # Branch runs (workflow_dispatch --ref <branch>) build and warm only.
          push: ${{ github.ref == 'refs/heads/main' }}
          # Fail the build if any warmup example (incl. SKY130 FETs) fails.
          build-args: WARMUP_STRICT=1
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
