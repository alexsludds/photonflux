[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photonflux"
version = "0.2.0"
description = "Differentiable photonic + analog co-simulation in Python: Verilog-A (OpenVAF/OSDI) photonics + SKY130 electronics in one JAX/circulax system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
    "scipy",
]

[project.optional-dependencies]
dev = ["pytest"]
# Eye-diagram / TDEC measurement (photonflux.tdec). Upstream stateye does not
# build on NumPy 2 and has no pyproject.toml; see docs/stateye-integration-plan.md
# section 2 for the two-line patch this needs until that lands.
eye = ["stateye @ git+https://github.com/AyarLabs/stateye"]

[project.scripts]
photonflux = "photonflux.cli:main"

[tool.setuptools]
packages = ["photonflux"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
