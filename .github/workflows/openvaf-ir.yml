# Builds the Linux openvaf-ir (BSIM4 -> OSDI compiler) once and publishes it as
# the `openvaf-ir` release asset, so the repo-root Dockerfile downloads it
# instead of compiling Rust + LLVM 18 on every build. Main only: the asset is
# what main's image uses, so branches must not overwrite it.
name: openvaf-ir

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docker/openvaf-ir.Dockerfile
      - .github/workflows/openvaf-ir.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build + smoke-test openvaf-ir
        run: docker buildx build -f docker/openvaf-ir.Dockerfile --target out --output type=local,dest=dist .
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="ChipFlow OpenVAF fork (vajax) @ $(cat dist/openvaf-ir.commit), built from ${GITHUB_SHA}. Downloaded by the Dockerfile; not a photonflux release."
          if gh release view openvaf-ir >/dev/null 2>&1; then
            gh release upload openvaf-ir dist/openvaf-ir-linux-x86_64 --clobber
            gh release edit openvaf-ir --notes "$notes"
          else
            gh release create openvaf-ir dist/openvaf-ir-linux-x86_64 \
              --title "openvaf-ir (Linux x86_64 build tool)" --notes "$notes" \
              --prerelease
          fi
