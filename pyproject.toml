[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photonflux"
version = "0.2.0"
description = "Differentiable photonic + analog co-simulation in Python: Verilog-A (OpenVAF/OSDI) photonics + SKY130 electronics in one JAX/circulax system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
    "scipy",
    # IBIS-AMI (photonflux.ibisami): PyAMI parses .ibs / .ami files and AMI
    # parameter strings. Pinned to a commit of its main branch, the first to
    # split the IBIS/AMI parsers from the GUI stack (#95/#96): the PyPI
    # release (9.3.1) still requires Chaco, TraitsUI, Jupyter and ReportLab.
    "pyibis-ami @ git+https://github.com/capn-freako/PyAMI@e00a010a70fdb4df1ef2a2aa42cbded771179dfd",
]

[project.optional-dependencies]
dev = ["pytest"]
# Eye-diagram / TDEC / TDECQ measurement (photonflux.tdec). DerekK44's fork is
# stateye 1.8 (adds PAM-4 + TDECQ). Like upstream it does not build on NumPy 2
# and has no pyproject.toml; apply docs/patches/stateye-modern-toolchain.patch
# (see docs/stateye-integration-plan.md section 2) until that lands.
eye = ["stateye @ git+https://github.com/DerekK44/stateye"]
# Bayesian optimization for the webapp flow Optimize step (webapp/bayesopt.py)
bo = ["botorch>=0.14"]

[project.scripts]
photonflux = "photonflux.cli:main"

[tool.setuptools]
packages = ["photonflux"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
